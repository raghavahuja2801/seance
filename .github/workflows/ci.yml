name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The server needs an agent id to boot. These checks only load static
      # files and never create a session, so no real id or API key is used.
      SEANCE_AGENT_ID: ci-no-sessions
      PORT: 8790
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start server
        run: |
          # --no-experimental-require-module: Vercel's loader rejects require() of ES modules,
          # which Node 22+ otherwise allows; fail here instead of in production.
          node --no-experimental-require-module src/server.ts > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8790/api/ghosts > /dev/null && exit 0; sleep 1; done
          cat server.log; exit 1
      - run: npm run check:browser
      - name: Server log
        if: failure()
        run: cat server.log
